# Render Blueprint for the Agendality API. Guide: docs/despliegue-render.md
# No secrets live in this file: they are generated by Render (generateValue), read from the
# database (fromDatabase) or typed in the Render Dashboard (sync: false).

services:
  - type: web
    name: agendality-api
    runtime: node
    plan: starter
    region: virginia
    branch: main
    # Merging into main does not publish: deploy by hand with Manual Deploy (docs/despliegue-render.md)
    autoDeployTrigger: "off"
    # Dev dependencies are needed: tsc builds dist/ and tsx runs the migrations (some are .ts files)
    buildCommand: npm ci --include=dev && npm run build
    # Runs on every deploy, after the build and before the new version receives traffic.
    # If a migration fails, the deploy stops and the previous version keeps running.
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /salud
    domains:
      - api.agendality.com
    # Uploaded photos (business, team and products). Without a disk they would be lost on every deploy.
    disk:
      name: subidas
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"

      # Database: internal connection (private network, same region)
      - key: DB_HOST
        fromDatabase:
          name: agendality-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: agendality-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: agendality-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: agendality-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: agendality-db
          property: password

      # Three independent secrets, generated once by Render. Never regenerate TOTP_SECRET:
      # the superadmin's two-step key is encrypted with it (see docs/despliegue-render.md).
      - key: JWT_SECRET
        generateValue: true
      - key: RECUPERACION_SECRET
        generateValue: true
      - key: TOTP_SECRET
        generateValue: true
      - key: JWT_EXPIRA_EN
        value: 12h

      # Render's load balancer is one trusted proxy; it terminates HTTPS
      - key: TRUST_PROXY
        value: "1"
      - key: DETRAS_DE_CLOUDFLARE
        value: "false"
      - key: CORS_ORIGINS
        value: https://agendality.com,https://www.agendality.com

      - key: URL_PUBLICA
        value: https://api.agendality.com
      - key: ENLACE_PUBLICO_BASE
        value: agendality.com
      - key: CARPETA_SUBIDAS
        value: /var/data/uploads

      # Subscription payments go through Wompi. The server refuses to start in production without the four
      # production keys (pub_prod_, prv_prod_, prod_events_, prod_integrity_) and URL_PAGOS. Values are set in the
      # Render dashboard only (sync: false); never commit them.
      - key: PROVEEDOR_PAGO
        value: wompi
      - key: WOMPI_LLAVE_PUBLICA
        sync: false
      - key: WOMPI_LLAVE_PRIVADA
        sync: false
      - key: WOMPI_SECRETO_EVENTOS
        sync: false
      - key: WOMPI_SECRETO_INTEGRIDAD
        sync: false
      # Where the payer returns after paying (the app or the website); "/<reference>" is appended. Required with Wompi.
      - key: URL_PAGOS
        sync: false
      # Optional: Expo access token for push notifications. Leave blank if not enabled in Expo.
      - key: EXPO_ACCESS_TOKEN
        sync: false

      # System emails (password recovery, trial notices) through Resend. Without the key nothing is sent.
      # The sender's domain (agendality.com) must be verified in Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        value: Agendality <no-reply@agendality.com>
      - key: CORREO_RESPONDER_A
        value: soporte@agendality.com

databases:
  - name: agendality-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "17"
    databaseName: agendality
    user: agendality
    # Only the services in this Render account can connect (no public access)
    ipAllowList: []
